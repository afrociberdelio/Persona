[project]
name = "persona"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mikael Souza", email = "contato@mikaelsouza.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.5.0",
    "lancedb>=0.34.0",
    "mcp>=1.28.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.27.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.5",
    "tzdata>=2026.2",
]

[project.scripts]
persona = "persona:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
